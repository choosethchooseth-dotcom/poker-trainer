<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTO Wizard Style Poker Trainer</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --panel-bg: #1e293b;
            --accent-blue: #3b82f6;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-yellow: #f59e0b;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-light); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* Header Navigation */
        header { background: #090d16; border-bottom: 1px solid var(--border-color); padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-weight: 800; font-size: 1.2rem; color: var(--accent-blue); letter-spacing: 0.5px; }
        .stats-bar { display: flex; gap: 20px; font-size: 0.9rem; }
        .stat-item { background: var(--panel-bg); padding: 6px 14px; border-radius: 6px; border: 1px solid var(--border-color); }
        .stat-value { font-weight: bold; color: var(--accent-green); }

        /* Main Workspace Layout */
        .workspace { display: grid; grid-template-columns: 1fr 400px; flex: 1; height: calc(100vh - 57px); }

        /* Left Pane: Poker Table & Controls */
        .game-pane { display: flex; flex-direction: column; justify-content: space-between; padding: 20px; position: relative; background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%); }

        /* Poker Table Graphical Area */
        .table-container { flex: 1; display: flex; justify-content: center; align-items: center; position: relative; }
        .poker-table { width: 560px; height: 280px; background: #064e3b; border: 12px solid #065f46; border-radius: 150px; position: relative; box-shadow: inset 0 0 40px rgba(0,0,0,0.8), 0 10px 25px rgba(0,0,0,0.5); }
        .pot-display { position: absolute; top: 32%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.6); padding: 6px 16px; border-radius: 20px; font-weight: bold; font-size: 0.95rem; border: 1px solid rgba(255,255,255,0.1); }
        
        .board-cards { position: absolute; top: 52%; left: 50%; transform: translate(-50%, -50%); display: flex; gap: 6px; }
        .card { width: 44px; height: 62px; background: white; border-radius: 5px; color: #1e293b; display: flex; flex-direction: column; justify-content: space-between; padding: 4px; font-weight: bold; font-size: 0.9rem; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .card.red { color: #dc2626; }
        .card.empty { background: rgba(255,255,255,0.05); border: 1px dashed rgba(255,255,255,0.2); }

        /* Seat Positions */
        .seat { position: absolute; width: 90px; background: var(--panel-bg); border: 2px solid var(--border-color); border-radius: 8px; padding: 6px; text-align: center; font-size: 0.8rem; }
        .seat.active { border-color: var(--accent-blue); box-shadow: 0 0 12px rgba(59, 130, 246, 0.4); }
        .seat-hero { bottom: -20px; left: 50%; transform: translateX(-50%); }
        .seat-villain { top: -20px; left: 50%; transform: translateX(-50%); }
        .hero-cards { display: flex; gap: 4px; justify-content: center; margin-top: 4px; }

        /* Hero Hand Sizing & Action HUD */
        .action-hud { background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
        .rng-bar-wrap { display: flex; align-items: center; gap: 12px; font-size: 0.85rem; }
        .rng-badge { background: #334155; padding: 4px 10px; border-radius: 4px; font-weight: bold; color: var(--accent-yellow); }
        
        .action-buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        .btn-action { padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; color: white; transition: all 0.15s ease; font-size: 0.9rem; }
        .btn-action:hover { filter: brightness(1.15); transform: translateY(-1px); }
        .btn-fold { background: var(--accent-blue); }
        .btn-check, .btn-call { background: var(--accent-green); }
        .btn-bet { background: var(--accent-red); }

        /* Right Pane: GTO Range Matrix & Feedback */
        .analysis-pane { background: var(--panel-bg); border-left: 1px solid var(--border-color); padding: 20px; display: flex; flex-direction: column; gap: 20px; overflow-y: auto; }
        .pane-title { font-weight: bold; font-size: 1rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }

        /* 13x13 Grid Matrix */
        .matrix-grid { display: grid; grid-template-columns: repeat(13, 1fr); gap: 2px; background: #0f172a; padding: 4px; border-radius: 6px; border: 1px solid var(--border-color); }
        .matrix-cell { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-size: 0.65rem; font-weight: bold; border-radius: 2px; cursor: pointer; user-select: none; color: #fff; }

        /* Feedback Modal/Card */
        .feedback-card { background: #0f172a; border: 1px solid var(--border-color); border-radius: 8px; padding: 16px; display: none; }
        .feedback-card.show { display: block; }
        .feedback-title { font-weight: bold; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
        .feedback-title.correct { color: var(--accent-green); }
        .feedback-title.blunder { color: var(--accent-red); }
        .ev-loss { font-size: 0.85rem; color: var(--text-muted); margin-top: 4px; }

        .btn-next { width: 100%; padding: 12px; background: var(--accent-blue); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>

    <header>
        <div class="logo">GTO TRAINER PRO</div>
        <div class="stats-bar">
            <div class="stat-item">Hand Score: <span class="stat-value" id="stat-score">100%</span></div>
            <div class="stat-item">EV Loss: <span class="stat-value" id="stat-ev" style="color:#ef4444;">-0.00 EV</span></div>
            <div class="stat-item">Hands Played: <span class="stat-value" id="stat-hands">0</span></div>
        </div>
    </header>

    <div class="workspace">
        <div class="game-pane">
            <div class="table-container">
                <div class="poker-table">
                    <div class="seat seat-villain">
                        <div>BTN (Villain)</div>
                        <div style="color:var(--accent-green);">$100.00</div>
                    </div>

                    <div class="pot-display" id="pot-size">POT: 6.5 BB</div>

                    <div class="board-cards" id="board-cards">
                        </div>

                    <div class="seat seat-hero active">
                        <div>BB (Hero)</div>
                        <div style="color:var(--accent-green);" id="hero-stack">$97.50</div>
                        <div class="hero-cards" id="hero-cards">
                            </div>
                    </div>
                </div>
            </div>

            <div class="action-hud">
                <div class="rng-bar-wrap">
                    <span>RNG Generator:</span>
                    <span class="rng-badge" id="rng-value">64</span>
                    <span style="color:var(--text-muted); font-size:0.8rem;">(Use to balance mixed GTO strategies)</span>
                </div>
                <div class="action-buttons" id="action-buttons">
                    </div>
            </div>
        </div>

        <div class="analysis-pane">
            <div>
                <div class="pane-title" style="margin-bottom:10px;">GTO Strategy Range Matrix</div>
                <div class="matrix-grid" id="matrix-grid">
                    </div>
            </div>

            <div class="feedback-card" id="feedback-card">
                <div class="feedback-title" id="feedback-title">GTO Optimal Choice</div>
                <div id="feedback-desc" style="font-size:0.9rem; line-height:1.4;"></div>
                <div class="ev-loss" id="ev-loss-text">EV Loss: 0.00 BB</div>
                <button class="btn-next" onclick="nextHand()">Next Spot ➔</button>
            </div>
        </div>
    </div>

    <script>
        // Hand Combos & Ranks Definition
        const ranks = ['A', 'K', 'Q', 'J', 'T', '9', '8', '7', '6', '5', '4', '3', '2'];
        const suits = [
            { code: 's', symbol: '♠', red: false },
            { code: 'h', symbol: '♥', red: true },
            { code: 'd', symbol: '♦', red: true },
            { code: 'c', symbol: '♣', red: false }
        ];

        // Sample Hand Spot Solutions
        const scenarios = [
            {
                spotName: "BB vs BTN Single Raised Pot (Flop Decision)",
                heroHand: { r1: 'A', r2: 'K', s1: suits[0], s2: suits[1] },
                board: [
                    { r: 'A', s: suits[2] },
                    { r: '8', s: suits[1] },
                    { r: '4', s: suits[3] }
                ],
                pot: "6.5 BB",
                actions: [
                    { name: "Check", gtoFreq: 78, type: "check", ev: 0 },
                    { name: "Bet 33%", gtoFreq: 22, type: "bet", ev: -0.05 },
                    { name: "Bet 75%", gtoFreq: 0, type: "bet", ev: -0.42 }
                ],
                recommended: "Check",
                reason: "On A-8-4 rainbow as Out of Position BB in SRP, GTO prefers checking top pair top kicker (AK) at high frequency to protect checking range."
            },
            {
                spotName: "BTN vs BB Single Raised Pot (Monotone Flop)",
                heroHand: { r1: 'K', r2: 'Q', s1: suits[0], s2: suits[0] },
                board: [
                    { r: 'J', s: suits[1] },
                    { r: '8', s: suits[1] },
                    { r: '2', s: suits[1] }
                ],
                pot: "5.5 BB",
                actions: [
                    { name: "Check", gtoFreq: 85, type: "check", ev: 0 },
                    { name: "Bet 33%", gtoFreq: 15, type: "bet", ev: -0.12 },
                    { name: "Fold", gtoFreq: 0, type: "fold", ev: -1.20 }
                ],
                recommended: "Check",
                reason: "On a monotone (3-heart) board without holding a heart blocker, KQo must check back to control pot size against check-raises."
            }
        ];

        let currentSpotIdx = 0;
        let playedHands = 0;
        let totalEvLoss = 0;

        // Initialize 13x13 Grid Matrix
        function renderMatrix() {
            const grid = document.getElementById('matrix-grid');
            grid.innerHTML = '';
            
            for (let i = 0; i < 13; i++) {
                for (let j = 0; j < 13; j++) {
                    const cell = document.createElement('div');
                    cell.className = 'matrix-cell';
                    
                    let handStr = "";
                    if (i < j) handStr = ranks[i] + ranks[j] + "s";
                    else if (i > j) handStr = ranks[j] + ranks[i] + "o";
                    else handStr = ranks[i] + ranks[j];

                    cell.innerText = handStr;
                    
                    // Style Matrix mock colors
                    if (i === j || (i < 3 && j < 3)) {
                        cell.style.background = "var(--accent-red)";
                    } else if (i < 5 && j < 5) {
                        cell.style.background = "var(--accent-green)";
                    } else {
                        cell.style.background = "var(--accent-blue)";
                    }

                    grid.appendChild(cell);
                }
            }
        }

        // Render Cards Graphical Components
        function renderCardHTML(card) {
            const isRed = card.s.red ? 'red' : '';
            return `<div class="card ${isRed}">
                <div>${card.r}</div>
                <div style="align-self:flex-end;">${card.s.symbol}</div>
            </div>`;
        }

        // Load Active Game Spot
        function loadSpot(idx) {
            const spot = scenarios[idx];
            document.getElementById('pot-size').innerText = `POT: ${spot.pot}`;
            
            // Render Board
            const boardElem = document.getElementById('board-cards');
            boardElem.innerHTML = spot.board.map(c => renderCardHTML(c)).join('');
            
            // Render Hero Hand
            const heroElem = document.getElementById('hero-cards');
            heroElem.innerHTML = renderCardHTML({ r: spot.heroHand.r1, s: spot.heroHand.s1 }) + 
                                 renderCardHTML({ r: spot.heroHand.r2, s: spot.heroHand.s2 });

            // Randomize RNG
            document.getElementById('rng-value').innerText = Math.floor(Math.random() * 100) + 1;

            // Render Actions
            const btnElem = document.getElementById('action-buttons');
            btnElem.innerHTML = '';
            
            spot.actions.forEach(act => {
                const btn = document.createElement('button');
                let cssClass = "btn-action ";
                if (act.type === 'fold') cssClass += 'btn-fold';
                else if (act.type === 'check' || act.type === 'call') cssClass += 'btn-check';
                else cssClass += 'btn-bet';

                btn.className = cssClass;
                btn.innerText = act.name;
                btn.onclick = () => handleUserAction(act, spot);
                btnElem.appendChild(btn);
            });

            // Hide Feedback
            document.getElementById('feedback-card').classList.remove('show');
        }

        // Action Evaluator
        function handleUserAction(selectedAct, spot) {
            playedHands++;
            const feedbackCard = document.getElementById('feedback-card');
            const feedbackTitle = document.getElementById('feedback-title');
            const feedbackDesc = document.getElementById('feedback-desc');
            const evText = document.getElementById('ev-loss-text');

            const isBest = selectedAct.name === spot.recommended;
            
            if (isBest || selectedAct.gtoFreq > 0) {
                feedbackTitle.className = "feedback-title correct";
                feedbackTitle.innerText = "✓ Correct GTO Action";
            } else {
                feedbackTitle.className = "feedback-title blunder";
                feedbackTitle.innerText = "✕ Blunder / Inaccurate Action";
                totalEvLoss += Math.abs(selectedAct.ev);
            }

            feedbackDesc.innerText = spot.reason;
            evText.innerText = `EV Impact: ${selectedAct.ev >= 0 ? '+0.00' : selectedAct.ev} BB | GTO Frequency: ${selectedAct.gtoFreq}%`;

            feedbackCard.classList.add('show');

            // Update Header Stats
            document.getElementById('stat-hands').innerText = playedHands;
            document.getElementById('stat-ev').innerText = `-${totalEvLoss.toFixed(2)} EV`;
        }

        function nextHand() {
            currentSpotIdx = (currentSpotIdx + 1) % scenarios.length;
            loadSpot(currentSpotIdx);
        }

        // Initialize App
        renderMatrix();
        loadSpot(0);
    </script>
</body>
</html>
